plugins {
    id 'com.gtnewhorizons.gtnhconvention'
    id 'com.diffplug.spotless' version '6.13.0'
}

def jdaVersion = '3.8.3'
def jdaJob = 464
def jdaFile = file("libs/JDA-${jdaVersion}_${jdaJob}-withDependencies.jar")

version = 'mc1.7.10-3.1.1_3.8.3_464'
group = "chikachi.discord"
archivesBaseName = "DiscordIntegrationUnoffical"

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'

    accessTransformersFile = file('src/main/resources/discordintegration_at.cfg')
}

// Package relocation configuration for RetroFuturaGradle
ext {
    extraSrgFile = new File(buildDir, "extra.srg")
}

// Generate SRG file with package relocations to avoid conflicts with other mods
task generateExtraSrg {
    outputs.file extraSrgFile

    doLast {
        extraSrgFile.parentFile.mkdirs()
        extraSrgFile.text = """\
PK: com/mashape/unirest chikachi/discord/repack/com/mashape/unirest
PK: com/neovisionaries/ws/client chikachi/discord/repack/com/neovisionaries/ws/client
PK: com/sun/jna chikachi/discord/repack/com/sun/jna
PK: com/vdurmont/emoji chikachi/discord/repack/com/vdurmont/emoji
PK: javax/sound chikachi/discord/repack/javax/sound
PK: javazoom chikachi/discord/repack/javazoom
PK: net/dv8tion/jda chikachi/discord/repack/net/dv8tion/jda
PK: net/sourceforge/jaad chikachi/discord/repack/net/sourceforge/jaad
PK: org/json chikachi/discord/repack/org/json
PK: org/kc7bfi/jflac chikachi/discord/repack/org/kc7bfi/jflac
PK: org/slf4j chikachi/discord/repack/org/slf4j
PK: org/tritonus chikachi/discord/repack/org/tritonus
PK: tomp2p/opuswrapper chikachi/discord/repack/tomp2p/opuswrapper
PK: org/apache/http chikachi/discord/repack/org/apache/http
PK: org/apache/commons/logging chikachi/discord/repack/org/apache/commons/logging
PK: org/apache/commons/codec chikachi/discord/repack/org/apache/commons/codec
PK: org/apache/commons/collections4 chikachi/discord/repack/org/apache/commons/collections4
PK: org/apache/commons/lang3 chikachi/discord/repack/org/apache/commons/lang3
""".stripIndent()
        printDebug "Generated extra SRG file with package relocations: ${extraSrgFile.absolutePath}"
    }
}

// Configure reobfJar to use the extra SRG file for package relocation
tasks.named("reobfJar").configure {
    dependsOn generateExtraSrg
    extraSrgFiles.from(extraSrgFile)
}

jar {
    // Pack dependencies into jar
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes("FMLAT": 'discordintegration_at.cfg')
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'src/main/resources'
            srcDir 'core/src/main/java'
        }
        // Don't include core resources - they conflict with main resources
    }
    test {
        java {
            srcDir 'core/src/test/java'
        }
    }
}

def printDebug(message) {
    println '[' + archivesBaseName + '] ' + message
}

def JDADependencyDownloader = {
    if (!jdaFile.exists()) {
        printDebug "JDA jar not found at ${jdaFile.absolutePath}"
        printDebug "Please place JDA jar in libs/ folder"
        printDebug "Download from: https://github.com/discord-jda/JDA/releases/download/v3.8.3/JDA-3.8.3_464-withDependencies.jar"
        throw new GradleException("JDA jar not found. File should be at: ${jdaFile.absolutePath}")
    }
    files(jdaFile)
}

dependencies {
    // Use runtimeOnlyNonPublishable to avoid deobfuscation transform on external jars
    runtimeOnlyNonPublishable JDADependencyDownloader()

    // Mark JDA as compileOnly so we can compile against it
    compileOnly JDADependencyDownloader()

    runtimeOnlyNonPublishable 'com.vdurmont:emoji-java:4.0.0'
    compileOnly 'com.vdurmont:emoji-java:4.0.0'

    // JDA dependencies
    runtimeOnlyNonPublishable 'org.json:json:20160810'
    compileOnly 'org.json:json:20160810'

    runtimeOnlyNonPublishable 'org.slf4j:slf4j-simple:1.7.25'
    compileOnly 'org.slf4j:slf4j-simple:1.7.25'

    // IntelliJ
    compileOnly 'org.jetbrains:annotations:15.0'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:2.+'
    testImplementation JDADependencyDownloader()
    testImplementation 'com.vdurmont:emoji-java:4.0.0'
    testImplementation 'org.json:json:20160810'
    testImplementation 'org.slf4j:slf4j-simple:1.7.25'
}

// Configure all jar tasks to handle duplicates
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.mcVersion

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand(
                'version': '3.1.1',
                'modVersion': '3.1.1',
                'mcversion': project.minecraft.mcVersion,
                'minecraftVersion': project.minecraft.mcVersion,
                'modId': 'discordintegration',
                'modName': 'Discord Integration Unofficial'
        )
    }

    // copy everything else, that's not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Disable test compilation and execution - tests are incompatible with JDA 3.8.3 (written for JDA 3.5.1)
tasks.named('compileTestJava') {
    enabled = false
}

tasks.named('processTestResources') {
    enabled = false
}

test {
    useJUnit()
    enabled = false
}

// Disable checkstyle for now (star import violations)
tasks.withType(Checkstyle) {
    enabled = false
}

// Spotless is already configured by gtnhconvention plugin

idea { module { inheritOutputDirs = true } }
