import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

buildscript {
    repositories {
        mavenCentral()
        maven {
            name 'forge'
            url 'https://maven.minecraftforge.net'
        }
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

apply plugin: 'forge'
apply plugin: 'com.github.johnrengelman.shadow'

def jdaVersion = '3.8.3'
def jdaJob = 464
def jdaFile = file("libs/JDA-${jdaVersion}_${jdaJob}-withDependencies.jar")

version = 'mc1.7.10-3.1.1_3.8.3_464'
group = "chikachi.discord"
archivesBaseName = "DiscordIntegrationUnoffical"

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// shade — зависимости для упаковки в jar с релокацией
configurations { shade }

def jdaDep = { files(jdaFile) }

dependencies {
    // JDA локальный jar (fat jar, уже содержит все transitive deps)
    compileOnly jdaDep()
    shade jdaDep()

    compileOnly 'com.vdurmont:emoji-java:4.0.0'
    shade 'com.vdurmont:emoji-java:4.0.0'

    compileOnly 'org.json:json:20160810'
    shade 'org.json:json:20160810'

    compileOnly 'org.slf4j:slf4j-simple:1.7.25'
    shade 'org.slf4j:slf4j-simple:1.7.25'

    compileOnly 'org.jetbrains:annotations:15.0'

    testImplementation 'junit:junit:4.12'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'core/src/main/java'
        }
    }
}

// jar содержит только классы проекта (без JDA), с classifier 'dev'
// reobf обфусцирует этот файл in-place
jar {
    archiveClassifier = 'dev'

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes("FMLAT": 'discordintegration_at.cfg')
    }
}

// shadowReobfJar — финальный jar:
//   1. Берёт ОБФУСЦИРОВАННЫЕ классы из jar (после reobf)
//   2. Добавляет JDA и остальные shade-зависимости
//   3. Применяет релокацию пакетов
//
// ВАЖНО: это кастомный таск типа ShadowJar, НЕ дефолтный shadowJar —
// Shadow НЕ добавляет к нему from(sourceSets.main.output) автоматически.
// Это исключает попадание деобфусцированных классов в финальный jar.
task shadowReobfJar(type: ShadowJar, dependsOn: 'reobf') {
    archivesBaseName = project.archivesBaseName
    archiveVersion = project.version
    archiveClassifier = ''

    // Не включать зависимости автоматически
    configurations = []

    // Обфусцированные классы проекта (jar был изменён reobf in-place)
    from zipTree(jar.archiveFile)

    // JDA и остальные shade-зависимости
    from project.configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'

    // Релокация пакетов — точное соответствие GTNH extraSrg
    relocate 'net.dv8tion.jda',                     'chikachi.discord.repack.net.dv8tion.jda'
    relocate 'com.mashape.unirest',                  'chikachi.discord.repack.com.mashape.unirest'
    relocate 'com.neovisionaries.ws.client',         'chikachi.discord.repack.com.neovisionaries.ws.client'
    relocate 'com.sun.jna',                          'chikachi.discord.repack.com.sun.jna'
    relocate 'com.vdurmont.emoji',                   'chikachi.discord.repack.com.vdurmont.emoji'
    relocate 'javax.sound',                          'chikachi.discord.repack.javax.sound'
    relocate 'javazoom',                             'chikachi.discord.repack.javazoom'
    relocate 'net.sourceforge.jaad',                 'chikachi.discord.repack.net.sourceforge.jaad'
    relocate 'org.json',                             'chikachi.discord.repack.org.json'
    relocate 'org.kc7bfi.jflac',                     'chikachi.discord.repack.org.kc7bfi.jflac'
    relocate 'org.slf4j',                            'chikachi.discord.repack.org.slf4j'
    relocate 'org.tritonus',                         'chikachi.discord.repack.org.tritonus'
    relocate 'tomp2p.opuswrapper',                   'chikachi.discord.repack.tomp2p.opuswrapper'
    relocate 'org.apache.http',                      'chikachi.discord.repack.org.apache.http'
    relocate 'org.apache.commons.logging',           'chikachi.discord.repack.org.apache.commons.logging'
    relocate 'org.apache.commons.codec',             'chikachi.discord.repack.org.apache.commons.codec'
    relocate 'org.apache.commons.collections4',      'chikachi.discord.repack.org.apache.commons.collections4'
    relocate 'org.apache.commons.lang3',             'chikachi.discord.repack.org.apache.commons.lang3'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergeServiceFiles()

    manifest {
        attributes("FMLAT": 'discordintegration_at.cfg')
    }
}

build.dependsOn shadowReobfJar

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version
    inputs.property "mcversion", "1.7.10"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand([
            'version'  : '3.1.1',
            'mcversion': '1.7.10'
        ])
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Тесты несовместимы с JDA 3.8.3 (написаны под 3.5.1)
tasks.named('compileTestJava')      { enabled = false }
tasks.named('processTestResources') { enabled = false }
test { useJUnit(); enabled = false }
